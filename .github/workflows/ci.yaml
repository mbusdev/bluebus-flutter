name: CI
on:
  pull_request:
    branches: [navigation-hub, maizebus2, maizebus-2.1, maizebus3, main]
  push:
    branches: []
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
      - run: echo "GOOGLE_MAPS_API_KEY=fake-key-for-ci-build-only" >> android/local.properties
      - name: Write dummy firebase_options.dart for CI build
        run: |
          cat > lib/firebase_options.dart << 'EOF'
          import 'package:firebase_core/firebase_core.dart';
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
              apiKey: 'fake-key-for-ci',
              appId: 'fake-app-id',
              messagingSenderId: 'fake-sender-id',
              projectId: 'fake-project-id',
            );
          }
          EOF
      - name: Write dummy google-services.json for CI build
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fake-project-id",
              "storage_bucket": "fake-project-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.ishankumar.maizebus"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "fake-api-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build app
        run: flutter build apk --debug --no-pub
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
  style_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run style checks
        run: python3 test/debug_print_check.py
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

name: Verify target branch is not main
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  check-target:
    runs-on: ubuntu-latest
    steps:
      - name: Verify target branch is not main
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$BASE" = "main" ] && [[ ",$LABELS," != *",release,"* ]]; then
            echo "Targeting main requires the 'release' label"
            echo "::error::Please change your target branch to the current working update branch (e.g. maizebus2.1). See https://docs.github.com/en/pull-requests/how-tos/create-pull-requests/changing-the-base-branch-of-a-pull-request"
            exit 1
          fi